name: Phase 10 Walk Forward

on:
  push:
    paths:
      - 'experiments/phase10_walkforward_adaptive.py'
      - '.github/workflows/phase10_walkforward.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Phase 10
        run: python experiments/phase10_walkforward_adaptive.py
      - name: Commit reproducible results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase10_walkforward_adaptive.json results/PHASE10_WALKFORWARD_ADAPTIVE.md
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Save Phase 10 walk-forward results'
            git push
          fi
