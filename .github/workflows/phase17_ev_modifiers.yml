name: Phase 17 EV Modifiers

on:
  push:
    paths:
      - 'src/ev_modifiers.py'
      - 'tests/test_ev_modifiers.py'
      - '.github/workflows/phase17_ev_modifiers.yml'
  workflow_dispatch:

jobs:
  test-phase17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run EV modifier tests
        run: pytest -q tests/test_ev_modifiers.py
# trigger: phase17-test
